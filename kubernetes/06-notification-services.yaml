---
# Notification Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ecommerce-notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3004
          name: metrics
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: ecommerce-secret
              key: RABBITMQ_URL
        - name: SMTP_HOST
          value: mailhog
        - name: SMTP_PORT
          value: "1025"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        restartPolicy: Always

---
# Notification Service (metrics scraping)
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
  labels:
    app: notification-service
spec:
  type: ClusterIP
  ports:
  - port: 3004
    targetPort: 3004
    name: metrics
  selector:
    app: notification-service

---
# MailHog Deployment (for testing emails)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailhog
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailhog
  template:
    metadata:
      labels:
        app: mailhog
    spec:
      containers:
      - name: mailhog
        image: mailhog/mailhog:latest
        ports:
        - containerPort: 1025
          name: smtp
        - containerPort: 8025
          name: ui
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"

---
# MailHog Service
apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: ecommerce
spec:
  type: ClusterIP
  ports:
  - port: 1025
    targetPort: 1025
    name: smtp
  - port: 8025
    targetPort: 8025
    name: ui
  selector:
    app: mailhog
