---
# Grafana datasource provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ecommerce
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 15s
          httpMethod: POST
      - name: Alertmanager
        uid: alertmanager
        type: alertmanager
        access: proxy
        url: http://alertmanager:9093
        editable: true
        jsonData:
          implementation: prometheus
          handleGrafanaManagedAlerts: false
    deleteDatasources:
      - { name: Prometheus,   orgId: 1 }
      - { name: Alertmanager, orgId: 1 }

---
# Grafana dashboard provider (points at /var/lib/grafana/dashboards)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: ecommerce
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: '00-platform-overview'
        orgId: 1
        folder: '00 - Platform Overview'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/00-Platform-Overview
      - name: '10-api-gateway'
        orgId: 1
        folder: '10 - API Gateway'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/10-API-Gateway
      - name: '20-services'
        orgId: 1
        folder: '20 - Services'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/20-Services
      - name: '30-data-layer'
        orgId: 1
        folder: '30 - Data Layer'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/30-Data-Layer
      - name: '40-infrastructure'
        orgId: 1
        folder: '40 - Infrastructure'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/40-Infrastructure
      - name: '50-business-kpis'
        orgId: 1
        folder: '50 - Business KPIs'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/50-Business-KPIs
      - name: '60-slo'
        orgId: 1
        folder: '60 - SLO / SLA'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/60-SLO
      - name: '90-alerting'
        orgId: 1
        folder: '90 - Alerting'
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards/90-Alerting

---
# Grafana PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-pvc
  namespace: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
      - name: grafana
        image: grafana/grafana:latest
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_SMTP_ENABLED
          value: "true"
        - name: GF_SMTP_HOST
          value: "mailhog:1025"
        - name: GF_SMTP_FROM_ADDRESS
          value: "grafana@ecommerce-platform.local"
        - name: GF_SMTP_SKIP_VERIFY
          value: "true"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: grafana-dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards
        - name: grafana-dashboards-00
          mountPath: /var/lib/grafana/dashboards/00-Platform-Overview
        - name: grafana-dashboards-10
          mountPath: /var/lib/grafana/dashboards/10-API-Gateway
        - name: grafana-dashboards-20
          mountPath: /var/lib/grafana/dashboards/20-Services
        - name: grafana-dashboards-30
          mountPath: /var/lib/grafana/dashboards/30-Data-Layer
        - name: grafana-dashboards-40
          mountPath: /var/lib/grafana/dashboards/40-Infrastructure
        - name: grafana-dashboards-50
          mountPath: /var/lib/grafana/dashboards/50-Business-KPIs
        - name: grafana-dashboards-60
          mountPath: /var/lib/grafana/dashboards/60-SLO
        - name: grafana-dashboards-90
          mountPath: /var/lib/grafana/dashboards/90-Alerting
        readinessProbe:
          httpGet: { path: /api/health, port: 3000 }
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /api/health, port: 3000 }
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests: { memory: "192Mi", cpu: "100m" }
          limits:   { memory: "512Mi", cpu: "300m" }
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-pvc
      - name: grafana-datasources
        configMap:
          name: grafana-datasources
      - name: grafana-dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: grafana-dashboards-00
        configMap:
          name: grafana-dashboards-00-platform-overview
          optional: true
      - name: grafana-dashboards-10
        configMap:
          name: grafana-dashboards-10-api-gateway
          optional: true
      - name: grafana-dashboards-20
        configMap:
          name: grafana-dashboards-20-services
          optional: true
      - name: grafana-dashboards-30
        configMap:
          name: grafana-dashboards-30-data-layer
          optional: true
      - name: grafana-dashboards-40
        configMap:
          name: grafana-dashboards-40-infrastructure
          optional: true
      - name: grafana-dashboards-50
        configMap:
          name: grafana-dashboards-50-business-kpis
          optional: true
      - name: grafana-dashboards-60
        configMap:
          name: grafana-dashboards-60-slo
          optional: true
      - name: grafana-dashboards-90
        configMap:
          name: grafana-dashboards-90-alerting
          optional: true

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecommerce
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: grafana
