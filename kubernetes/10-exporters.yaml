---
# ─── Node Exporter (DaemonSet — host metrics) ─────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: ecommerce
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:latest
        args:
          - '--path.procfs=/host/proc'
          - '--path.sysfs=/host/sys'
          - '--path.rootfs=/host/root'
          - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: metrics
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
        - name: sys
          mountPath: /host/sys
          readOnly: true
        - name: root
          mountPath: /host/root
          mountPropagation: HostToContainer
          readOnly: true
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: proc
        hostPath: { path: /proc }
      - name: sys
        hostPath: { path: /sys }
      - name: root
        hostPath: { path: / }
      tolerations:
      - operator: Exists

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: ecommerce
  labels:
    app: node-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9100
    targetPort: 9100
  selector:
    app: node-exporter

---
# ─── Postgres Exporter ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:latest
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: ecommerce-secret, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: ecommerce-secret, key: DB_PASSWORD }
        - name: DATA_SOURCE_NAME
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/ecommerce?sslmode=disable"
        ports:
        - containerPort: 9187
        resources:
          requests: { memory: "64Mi", cpu: "50m" }
          limits:   { memory: "192Mi", cpu: "200m" }

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: ecommerce
  labels:
    app: postgres-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9187
    targetPort: 9187
  selector:
    app: postgres-exporter

---
# ─── Redis Exporter ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        env:
        - name: REDIS_ADDR
          value: "redis://redis:6379"
        ports:
        - containerPort: 9121
        resources:
          requests: { memory: "32Mi", cpu: "50m" }
          limits:   { memory: "128Mi", cpu: "150m" }

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: ecommerce
  labels:
    app: redis-exporter
spec:
  type: ClusterIP
  ports:
  - port: 9121
    targetPort: 9121
  selector:
    app: redis-exporter
