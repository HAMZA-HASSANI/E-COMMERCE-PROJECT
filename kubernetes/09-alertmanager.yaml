---
# Alertmanager configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ecommerce
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'mailhog:1025'
      smtp_from: 'alerts@ecommerce-platform.local'
      smtp_require_tls: false

    inhibit_rules:
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ['alertname', 'job', 'instance']

    route:
      receiver: 'default-receiver'
      group_by: ['alertname', 'job', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

      routes:
        - matchers: [ severity = "critical" ]
          receiver: 'critical-receiver'
          group_wait: 10s
          repeat_interval: 1h
          continue: true

        - matchers: [ category = "security" ]
          receiver: 'security-receiver'
          repeat_interval: 30m
          continue: true

        - matchers: [ category = "business" ]
          receiver: 'business-receiver'
          repeat_interval: 2h

        - matchers: [ category =~ "database|cache|broker|infrastructure" ]
          receiver: 'ops-receiver'
          repeat_interval: 2h

    receivers:
      - name: 'default-receiver'
        email_configs:
          - to: 'devteam@ecommerce-platform.local'
            send_resolved: true
            headers:
              Subject: '[ALERT - {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'

      - name: 'critical-receiver'
        email_configs:
          - to: 'oncall@ecommerce-platform.local'
            send_resolved: true
            headers:
              Subject: '[CRITICAL - {{ .Status | toUpper }}] {{ .GroupLabels.alertname }} on {{ .GroupLabels.job }}'

      - name: 'security-receiver'
        email_configs:
          - to: 'security@ecommerce-platform.local'
            send_resolved: true
            headers:
              Subject: '[SECURITY - {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'

      - name: 'business-receiver'
        email_configs:
          - to: 'product@ecommerce-platform.local'
            send_resolved: true
            headers:
              Subject: '[BUSINESS - {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'

      - name: 'ops-receiver'
        email_configs:
          - to: 'ops@ecommerce-platform.local'
            send_resolved: true
            headers:
              Subject: '[OPS - {{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-pvc
  namespace: ecommerce
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
        runAsUser: 65534
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        args:
          - '--config.file=/etc/alertmanager/alertmanager.yml'
          - '--storage.path=/alertmanager'
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager/alertmanager.yml
          subPath: alertmanager.yml
        - name: alertmanager-storage
          mountPath: /alertmanager
        readinessProbe:
          httpGet: { path: /-/ready, port: 9093 }
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /-/healthy, port: 9093 }
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-storage
        persistentVolumeClaim:
          claimName: alertmanager-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  ports:
  - port: 9093
    targetPort: 9093
  selector:
    app: alertmanager
